# C# (P/Invoke) wrapper: CMake builds the native library, then xUnit calls it,
# on each OS. Windows here is the only place the MSVC build and echo_core.dll
# are exercised.
name: dotnet

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test dotnet/EchoCore.Tests
